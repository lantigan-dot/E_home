<!doctype html><html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>ЭНЕРГО — GitHub Pages ready</title><script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-with-polyfills-latest.js"></script><script src="./config.js"></script><style>body{margin:0;background:#ecece7;color:#161714;font:14px Arial,sans-serif}.app{max-width:900px;margin:auto;padding:24px}.card{background:#f8f8f5;border:1px solid #cfd0c8;padding:20px;margin:14px 0}.btn{min-height:46px;padding:11px 16px;border:0;cursor:pointer;font:inherit}.btn-red{background:#fc3f1d;color:#fff;font-weight:700}.muted{color:#63645e}.ok{color:#3c6d14}.err{color:#8a271c}code{background:#ecece7;padding:2px 6px}</style></head><body><main class="app"><div class="card"><h1>ЭНЕРГО / GitHub Pages</h1><p class="muted">Сборка для публикации на GitHub Pages с OAuth-входом Яндекс ID.</p><button id="loginBtn" class="btn btn-red">Войти с Яндекс ID</button><p id="status" class="muted">Ожидание авторизации.</p></div><div class="card"><h2>Текущая конфигурация</h2><p><b>Origin:</b> <code id="origin"></code></p><p><b>Base path:</b> <code id="base"></code></p><p><b>Redirect URI:</b> <code id="redirect"></code></p><p><b>API:</b> <code id="api"></code></p></div></main><script>const cfg=window.ENERGO_CONFIG||{};document.getElementById('origin').textContent=cfg.appOrigin||'не задан';document.getElementById('base').textContent=cfg.appBasePath||'/';document.getElementById('redirect').textContent=cfg.redirectUri||'не задан';document.getElementById('api').textContent=cfg.apiBase||'не задан';let authHandler=null;async function ensureAuth(){if(!cfg.yandexClientId||cfg.yandexClientId.includes('ВАШ_'))throw new Error('Сначала заполните config.js');authHandler=authHandler||await window.YaAuthSuggest.init({client_id:cfg.yandexClientId,response_type:'token',redirect_uri:cfg.redirectUri,scope:'iot:view iot:control'},cfg.appOrigin+(cfg.appBasePath||'/').replace(/\/$/,''));return authHandler}document.getElementById('loginBtn').addEventListener('click',async()=>{const status=document.getElementById('status');try{status.className='muted';status.textContent='Открываем окно Яндекс ID…';const h=await ensureAuth();const data=await h.handler();if(!data||!data.access_token)throw new Error('Токен не получен');status.className='ok';status.textContent='Успешно: access_token получен. Можно подключать API Умного дома.'}catch(e){status.className='err';status.textContent='Ошибка: '+e.message}});</script></body></html>
